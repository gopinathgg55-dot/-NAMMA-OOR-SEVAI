name: Android Build
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.5
          cache-disabled: true

      - name: Auto-Fix Firebase Libraries
        run: |
          # உங்க app/build.gradle-ல் Firebase இல்லை என்றால் தானாக சேர்க்கும்
          if ! grep -q "firebase-firestore" app/build.gradle; then
            sed -i "/dependencies {/a \    implementation platform('com.google.firebase:firebase-bom:32.7.0')\n    implementation 'com.google.firebase:firebase-firestore'\n    implementation 'com.google.android.gms:play-services-tasks:18.0.2'" app/build.gradle
          fi
          cat app/build.gradle

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Namma-Oor-Sevai-APK
          path: app/build/outputs/apk/debug/app-debug.apk
